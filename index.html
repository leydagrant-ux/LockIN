<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1319">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LockIN">
<title>LockIN</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
/* ============================== tokens ============================== */
/* Dark only, on purpose: this is used in gyms and at 6am. The chart colours are
   the validated categorical palette — see ui.js GROUP_COLOR. */
:root {
  --bg:#0f1319; --surface:#171d26; --surface-2:#1e2530; --line:#252d3a;
  --line-soft:#1f2732;
  --text:#e9eef5; --dim:#8994a4; --faint:#5d6775;
  --accent:#ff4f6a; --accent-dim:#c04358; --on-accent:#fff;
  --good:#46d39a; --warn:#ffb020; --bad:#ff5069;
  --r:14px; --r-lg:20px;
  --tab-h:58px;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
/* ---------- themes ---------- */
/* GENERATED by gen_theme.py, and generated for a reason: the surface and
   line colours are the original palette's exact depth steps re-applied to
   each background, and --on-accent is whichever of white or near-black
   actually passes contrast on that accent. Picking either by eye is how
   you end up with white text on amber. */
:root[data-bg="midnight"] { --bg:#0f1319; --surface:#171d26; --surface-2:#1e2530; --line:#252d3a; --line-soft:#1f2732; }
:root[data-bg="charcoal"] { --bg:#131313; --surface:#1b1d20; --surface-2:#22252a; --line:#292d34; --line-soft:#23272c; }
:root[data-bg="ink"] { --bg:#0b1020; --surface:#131a2d; --surface-2:#1a2237; --line:#212a41; --line-soft:#1b2439; }
:root[data-bg="espresso"] { --bg:#161210; --surface:#1e1c1d; --surface-2:#252427; --line:#2c2c31; --line-soft:#262629; }
:root[data-bg="forest"] { --bg:#0c1512; --surface:#141f1f; --surface-2:#1b2729; --line:#222f33; --line-soft:#1c292b; }

:root[data-accent="crimson"] { --accent:#ff4f6a; --accent-dim:#bf3b50; --on-accent:#ffffff; }
:root[data-accent="blue"] { --accent:#3987e5; --accent-dim:#2b65ac; --on-accent:#ffffff; }
:root[data-accent="violet"] { --accent:#8b5cf6; --accent-dim:#6845b8; --on-accent:#ffffff; }
:root[data-accent="teal"] { --accent:#14b8a6; --accent-dim:#0f8a7c; --on-accent:#101418; }
:root[data-accent="green"] { --accent:#22c55e; --accent-dim:#1a9446; --on-accent:#101418; }
:root[data-accent="amber"] { --accent:#f59e0b; --accent-dim:#b87608; --on-accent:#101418; }
:root[data-accent="pink"] { --accent:#ec4899; --accent-dim:#b13673; --on-accent:#ffffff; }

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; height:100%; height:100dvh; }
body {
  background:var(--bg); color:var(--text);
  font:15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button, input, select, textarea { font:inherit; color:inherit; }
button { background:none; border:0; cursor:pointer; }
a { color:var(--accent); }

/* ============================== layout ============================== */
#app { min-height:100%; display:flex; flex-direction:column; }
.screen { flex:1; padding:calc(16px + var(--safe-t)) 16px calc(var(--tab-h) + var(--safe-b) + 20px); max-width:640px; margin:0 auto; width:100%; }
.screen.no-tabs { padding-bottom:32px; }

.top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
.top h1 { font-size:22px; letter-spacing:-.02em; margin:0; }
.top .sub { color:var(--dim); font-size:13px; margin-top:2px; }

/* ============================== tab bar ============================== */
.tabs {
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  height:calc(var(--tab-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  display:grid; grid-template-columns:repeat(6,1fr);
  background:rgba(15,19,25,.93); backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}
.tabs button {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--faint); font-size:10px; letter-spacing:.02em;
  /* Six tabs on a 375px screen is 62px each. Without this the longest label
     wraps and shoves the icons out of line with their neighbours. */
  min-width:0; padding:0 2px;
}
.tabs button span { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tabs button[aria-current="page"] { color:var(--accent); }
.tabs svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8;
            stroke-linecap:round; stroke-linejoin:round; }

/* ============================== cards ============================== */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; margin-bottom:12px; }
.card.tight { padding:12px 14px; }
.card-title { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); margin:0 0 12px; font-weight:600; }
/* `row` is the flex utility. It only ever existed as `.card-title.row`, so
   every bare `class="row"` in ui.js was silently stacking its children into a
   column. `.card-title.row` now layers space-between on top of it. */
.row { display:flex; align-items:center; gap:10px; }
.card-title.row { justify-content:space-between; }

.stat { font:800 30px/1 system-ui; letter-spacing:-.03em; }
.stat small { font-size:13px; color:var(--dim); font-weight:500; letter-spacing:0; }
.muted { color:var(--dim); }
.faint { color:var(--faint); }
.tiny { font-size:12px; }
.center { text-align:center; }

/* ============================== controls ============================== */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--text);
  border-radius:12px; padding:11px 16px; font-weight:600; font-size:15px;
  min-height:44px; transition:filter .12s;
}
.btn:active { filter:brightness(1.35); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn.ghost { background:none; }
.btn.wide { width:100%; }
.btn.sm { padding:7px 12px; font-size:13px; min-height:36px; border-radius:10px; }
.btn:disabled { opacity:.45; }
.btn-row { display:flex; gap:8px; }
.btn-row .btn { flex:1; }

.field { margin-bottom:12px; }
.field label { display:block; font-size:12px; color:var(--dim); margin-bottom:5px; font-weight:600; }
/* 16px is not a taste call: iOS Safari zooms the whole page in whenever a
   focused input is smaller, and it does not zoom cleanly back out. */
.field input, .field select, .field textarea {
  width:100%; background:var(--surface-2); border:1px solid var(--line);
  border-radius:11px; padding:11px 12px; min-height:44px; font-size:16px;
}
.field input:focus, .field select:focus, .field textarea:focus { outline:2px solid var(--accent-dim); outline-offset:-1px; }
.field textarea { min-height:78px; resize:vertical; }
.field-row { display:flex; gap:8px; }
.field-row .field { flex:1; }

.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chip {
  background:var(--surface-2); border:1px solid var(--line); color:var(--dim);
  border-radius:999px; padding:8px 13px; font-size:13px; font-weight:600; min-height:38px;
}
.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.chip.sm { padding:5px 10px; font-size:12px; min-height:30px; }

/* Range inputs: bigger thumbs than default, this gets used with gym hands. */
input[type=range] { -webkit-appearance:none; width:100%; background:transparent; height:34px; }
input[type=range]::-webkit-slider-runnable-track { height:5px; background:var(--surface-2); border-radius:3px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
  background:var(--accent); margin-top:-11px; border:2px solid var(--bg);
}
input[type=range]::-moz-range-track { height:5px; background:var(--surface-2); border-radius:3px; }
input[type=range]::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); }

.switch { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; min-height:48px; }
.switch + .switch { border-top:1px solid var(--line-soft); }
.switch input { appearance:none; width:46px; height:28px; border-radius:999px;
  background:var(--surface-2); border:1px solid var(--line); position:relative; flex:none; }
.switch input::after { content:''; position:absolute; top:2px; left:2px; width:22px; height:22px;
  border-radius:50%; background:var(--faint); transition:transform .15s, background .15s; }
.switch input:checked { background:var(--accent); border-color:var(--accent); }
.switch input:checked::after { transform:translateX(18px); background:#fff; }

/* ============================== lists ============================== */
.list-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line-soft); }
.list-row:first-child { border-top:0; }
.list-row .grow { flex:1; min-width:0; }
.list-row b { font-weight:600; display:block; }
.ellip { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.empty { text-align:center; color:var(--dim); padding:28px 16px; font-size:14px; }
.empty .big { font-size:32px; margin-bottom:8px; }

/* ============================== body map ============================== */
.body-wrap { display:flex; gap:8px; justify-content:center; }
.body-wrap > figure { margin:0; flex:1; text-align:center; max-width:180px; }
.body-svg { width:100%; height:auto; display:block; }
.body-wrap figcaption { color:var(--dim); font-size:11px; margin-top:2px; }

/* ============================== charts ============================== */
/* Recessive grid and axes, per the dataviz rules: the data is the loud part. */
.chart { width:100%; height:auto; display:block; overflow:visible; }
.chart .grid { stroke:var(--line-soft); stroke-width:1; }
.chart .axis { fill:var(--faint); font-size:10px; }
.chart .mark { stroke:none; }
.chart .line { fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.chart .dot { stroke:var(--surface); stroke-width:2; }

.legend { display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:10px; }
.legend span { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
.legend i { width:9px; height:9px; border-radius:3px; flex:none; }

.bar { height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
.bar i { display:block; height:100%; border-radius:3px; }
/* Two segments in one bar: measured sets, then the estimate from classes.
   `.bar i` is display:block, so without this the second segment would stack
   under the first and be clipped by the overflow rule. */
.bar.split { display:flex; }
.bar.split i { border-radius:0; }
.bar.split i:first-child { border-radius:3px 0 0 3px; }
.bar.split i:last-child { border-radius:0 3px 3px 0; }

.heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:3px; }
.heat i { aspect-ratio:1; border-radius:3px; background:var(--surface-2); }
.heat i[data-l="1"] { background:#2f4a44; }
.heat i[data-l="2"] { background:#2b6b57; }
.heat i[data-l="3"] { background:var(--good); }

/* ============================== sheet ============================== */
.sheet-back { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
  display:flex; align-items:flex-end; justify-content:center; }
.sheet {
  background:var(--surface); width:100%; max-width:640px; max-height:88vh; max-height:88dvh;
  border-radius:22px 22px 0 0; border-top:1px solid var(--line);
  display:flex; flex-direction:column; animation:up .2s ease-out;
}
@keyframes up { from { transform:translateY(20px); opacity:0; } }
@media (prefers-reduced-motion:reduce) { .sheet { animation:none; } }
.sheet-head { display:flex; align-items:center; justify-content:space-between;
  padding:16px; border-bottom:1px solid var(--line); flex:none; }
.sheet-head h2 { margin:0; font-size:17px; }
/* Column flex children get crushed in a scrolling sheet without this. */
.sheet-body { padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.sheet-body > * { flex:0 0 auto; }
.sheet-foot { padding:12px 16px calc(16px + var(--safe-b)); border-top:1px solid var(--line); flex:none; }

/* ============================== misc ============================== */
.banner { border-radius:12px; padding:11px 13px; font-size:13px; margin-bottom:12px; line-height:1.4; }
.banner.warn { background:rgba(255,176,32,.1); border:1px solid rgba(255,176,32,.28); color:#ffcd6b; }
.banner.bad { background:rgba(255,80,105,.1); border:1px solid rgba(255,80,105,.28); color:#ff8a9c; }
.banner.ok { background:rgba(70,211,154,.1); border:1px solid rgba(70,211,154,.28); color:var(--good); }
.banner.info { background:var(--surface-2); border:1px solid var(--line); color:var(--dim); }

/* A toast floats over whatever is on screen, so it needs an OPAQUE base. The
   inline tints above are 10% alpha, which is right inside a card and unreadable
   sitting on top of another control. These are those same tints composited over
   the sheet background, so a floating toast looks identical to an inline one. */
.banner.float { background-color:#1e2530; }
.banner.float.warn { background-color:#2e2c25; }
.banner.float.bad  { background-color:#2e222d; }
.banner.float.ok   { background-color:#1c2f32; }
.banner.float.info { background-color:#1e2530; }

.pill { display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;
        letter-spacing:.03em; text-transform:uppercase; }
.pill.pr { background:var(--warn); color:#3a2600; }
.pill.new { background:var(--accent); color:var(--on-accent); }

.spinner { width:20px; height:20px; border:2px solid var(--line); border-top-color:var(--accent);
  border-radius:50%; animation:spin .7s linear infinite; display:inline-block; vertical-align:-4px; }
@keyframes spin { to { transform:rotate(360deg); } }

.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }

hr.sep { border:0; border-top:1px solid var(--line-soft); margin:14px 0; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<div id="app">
  <div class="screen no-tabs center" style="padding-top:80px">
    <div class="spinner"></div>
    <div class="muted tiny" style="margin-top:12px">Loading LockIN…</div>
  </div>
</div>

<script type="module" src="./ui.js"></script>
<script>
/* Registered from the page rather than ui.js so a module-load failure still
   leaves a working service worker, and vice versa. The relative path matters:
   this deploys to a project page at /LockIN/, not a domain root. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* fine offline */ });
  });
}
</script>
</body>
</html>
